# Copy to .github/workflows/daily-logger.yml to run the Lab 4 forward logger every day at 00:10 UTC.
# It appends to data/forward/*.csv and commits them back. Review before enabling.
name: daily-logger
on:
  schedule:
    - cron: "10 0 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - run: python scripts/daily_logger.py
      - run: |
          git config user.name "daily-logger"
          git config user.email "daily-logger@users.noreply.github.com"
          git add -f data/forward/*.csv
          git commit -m "forward log $(date -u +%F)" || echo "nothing to commit"
          git push
